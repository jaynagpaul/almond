name: Claude Code Review

# Reviews every non-draft pull request against CLAUDE.md.
# Needs the ANTHROPIC_API_KEY repository secret.
# Pull requests from forks are skipped by the action (allow_fork_prs is off).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is checked out in the working directory. Read CLAUDE.md
            first: it describes Almond's architecture and the engineering
            principles this repository holds code to.

            Review the diff. Report, most important first:
            1. Correctness bugs: wrong results, panics, data loss, broken
               invariants of the review log or card state, FFI misuse.
            2. Breaks of CLAUDE.md, such as I/O or clock reads inside the pure
               core, decisions made in the Swift shell, invalid states the
               types allow, or tests pinned to implementation.
            3. Simplifications that remove code or state without losing behavior.

            Post each finding as an inline comment on the line it concerns, and
            say what input or state triggers it. Then post one short summary
            comment. Skip style nits that rustfmt, clippy or swift-format would
            catch, and skip praise. If you find nothing worth fixing, say so in
            one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
