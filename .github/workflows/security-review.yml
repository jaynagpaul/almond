name: Security Review

# Claude security review of each pull request's diff.
# Needs the ANTHROPIC_API_KEY repository secret.
# The action is not hardened against prompt injection, so it runs only for PRs
# from branches in this repository. Fork PRs get no secrets and are skipped.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # No release tags upstream, so pin a commit instead of tracking main.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          comment-pr: true
          exclude-directories: target,generated
          custom-security-scan-instructions: .github/security-review/almond-scan-instructions.txt
