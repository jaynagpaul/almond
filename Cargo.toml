[workspace]
resolver = "3"
members = ["crates/almond-core", "crates/almond-store", "crates/almond-ffi"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
rust-version = "1.88"

[workspace.dependencies]
almond-core = { path = "crates/almond-core" }
almond-store = { path = "crates/almond-store" }
fsrs = "7.0"
jiff = { version = "1.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ulid = { version = "3", default-features = false }
uniffi = "0.33"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
